name: probe

# 探测调度放在这里，而不是 Vercel Cron —— Vercel Hobby 计划一天只能触发一次。
# 注意：GitHub Actions 的定时任务在高峰期可能延迟几分钟，这是免费的代价，可以接受。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  # 备用触发口。
  #
  # GitHub 的 schedule 是「尽力而为」：高峰期可能延迟，负载极高时甚至直接丢弃。
  # 而且**新建仓库的 schedule 往往要等几十分钟到一小时才开始生效**。
  #
  # 想更稳就用外部 cron 打这个口子（cron-job.org / Cloudflare Worker 都行，都免费）：
  #   POST https://api.github.com/repos/1471165191/anyrouter-watch/dispatches
  #   Authorization: Bearer <一个只有 repo 权限的细粒度 token>
  #   { "event_type": "probe" }
  repository_dispatch:
    types: [probe]

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 执行探测
        run: node scripts/probe.mjs
        env:
          ANYROUTER_KEY: ${{ secrets.ANYROUTER_KEY }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          PROBE_REGION: github-actions
